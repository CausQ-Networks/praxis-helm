apiVersion: v2
version: 0.1.0
appVersion: "0.20.0"
kubeVersion: ">=1.30.14-0"
name: praxis-cli
description: Helm chart to run Praxis sites with the Praxis CLI (causq-networks/praxis-cli)
type: application
keywords:
  - pangolin
  - praxis-cli
  - site
  - vpn
  - wireguard
  - networking
home: https://digpangolin.com/
icon: https://raw.githubusercontent.com/causq-networks/praxis/refs/heads/main/public/logo/praxis_orange.svg
sources:
  - https://github.com/CausQ-Networks/praxis-helm
  - https://github.com/CausQ-Networks/praxis-cli
maintainers:
  - name: Fossorial Inc
    email: contact@pangolin.net
annotations:
  artifacthub.io/category: networking
  artifacthub.io/changes: |
    - kind: added
      description: "Initial release. Runs Praxis sites with `praxis-cli up site`, configured through SITE_* environment variables or CLI flags."
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: praxis-cli-dockerhub
      image: docker.io/causq-networks/praxis-cli:0.20.0
      whitelisted: false
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
    - name: praxis-cli-ghcr
      image: ghcr.io/causq-networks/praxis-cli:0.20.0
      whitelisted: false
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: support
      url: https://github.com/CausQ-Networks/praxis-helm/issues
    - name: documentation
      url: https://docs.digpangolin.com/self-host/manual/kubernetes
  artifacthub.io/prerelease: "false"
  artifacthub.io/signKey: |
    fingerprint: 48E7F670FCC13645FC48B08D587294B228C2EC2C
    url: https://charts.fossorial.io/pgp_keys.asc

