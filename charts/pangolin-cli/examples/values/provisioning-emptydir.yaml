siteInstances:
  - name: main-tunnel
    enabled: true
    pangolinEndpoint: https://praxis.example.com

    provisioningKey: "YOUR_PROVISIONING_KEY"
    siteName: "my-site"

    configPersistence:
      enabled: true
      type: emptyDir
      mountPath: /var/lib/praxis
      fileName: config.json
