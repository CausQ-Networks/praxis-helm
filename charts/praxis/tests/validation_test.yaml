suite: chart validation
templates:
  - templates/validate.yaml
tests:
  - it: fails when controller single mode is selected without controller enabled
    set:
      deployment.mode: single
      deployment.type: controller
      controller.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "praxis-016: deployment.mode=single with deployment.type=controller requires controller.enabled=true."

  - it: fails when dashboard_url is empty in non-sqlite mode
    set:
      database.mode: cloudnativepg
      praxis.config.app.dashboard_url: ""
    asserts:
      - failedTemplate:
          errorMessage: "praxis-055: praxis.config.app.dashboard_url must be set (non-empty). For development/testing only, set database.mode=sqlite to bypass this validation."

  - it: fails when domains map is empty in non-sqlite mode
    set:
      database.mode: cloudnativepg
      praxis.config.domains: null
    asserts:
      - failedTemplate:
          errorMessage: "praxis-056: praxis.config.domains must contain at least one domain entry with base_domain and cert_resolver. For development/testing only, set database.mode=sqlite to bypass this validation."

  - it: fails when configured domain entry misses cert_resolver
    set:
      database.mode: cloudnativepg
      praxis.config.domains:
        domain1:
          base_domain: example.com
          cert_resolver: ""
    asserts:
      - failedTemplate:
          errorMessage: "praxis-059: praxis.config.domains.domain1.cert_resolver must be set (non-empty)."

  - it: fails when gerbil base_endpoint is empty in non-sqlite mode
    set:
      database.mode: cloudnativepg
      praxis.config.gerbil.base_endpoint: ""
    asserts:
      - failedTemplate:
          errorMessage: "praxis-060: praxis.config.gerbil.base_endpoint must be set (non-empty). For development/testing only, set database.mode=sqlite to bypass this validation."

  - it: allows empty required praxis config in sqlite dev/test mode
    set:
      database.mode: sqlite
      praxis.config.app.dashboard_url: ""
      praxis.config.domains: {}
      praxis.config.gerbil.base_endpoint: ""
      praxis.ingressRoute.dashboard.enabled: false
    asserts:
      - notFailedTemplate: {}

  - it: fails when CNPG cluster names drift
    set:
      database.mode: cloudnativepg
      cnpg-cluster.enabled: true
      database.cloudnativepg.cluster.name: foo
      cnpg-cluster.fullnameOverride: bar
    asserts:
      - failedTemplate:
          errorMessage: "praxis-CNPG: cnpg-cluster.fullnameOverride and database.cloudnativepg.cluster.name must match when cnpg-cluster.enabled=true"

  - it: allows cnpg-cluster.fullnameOverride to define CNPG name when database cluster name is default
    set:
      database.mode: cloudnativepg
      cnpg-cluster.enabled: true
      cnpg-cluster.fullnameOverride: custom-cnpg
    asserts:
      - notFailedTemplate: {}

  - it: fails when standalone traefik enabled without ACME email
    set:
      traefik.enabled: true
      traefik.config.letsencryptEmail: ""
    asserts:
      - failedTemplate:
          errorMessage: "praxis-014: traefik.config.letsencryptEmail must be set when traefik.enabled=true"

  - it: fails when standalone traefik enabled with placeholder router host
    set:
      traefik.enabled: true
      traefik.config.letsencryptEmail: "ops@example.com"
      traefik.config.dynamicRouters.host: "example.com"
    asserts:
      - failedTemplate:
          errorMessage: "praxis-043: traefik.config.dynamicRouters.host must be set to a real hostname (must not be empty or example.com) when traefik.enabled=true"

  - it: fails when standalone traefik dashboard enabled without persistence
    set:
      traefik.enabled: true
      traefik.config.letsencryptEmail: "ops@example.com"
      traefik.config.dynamicRouters.host: "praxis.local"
      traefik.config.dashboard: true
      traefik.persistence.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "praxis-015: traefik.persistence.enabled must be true when traefik.config.dashboard=true (ACME state should persist to avoid rate limits on restarts)"

  - it: fails when enabling traefik dependency outside controller mode
    set:
      deployment.type: standalone
      deployment.installTraefikController: true
    asserts:
      - failedTemplate:
          errorMessage: "praxis-012: deployment.installTraefikController=true requires deployment.type=controller"

  - it: fails when traefik subchart is disabled while being installed
    set:
      deployment.type: controller
      deployment.installTraefikController: true
      traefikController.deployment.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "praxis-080: traefikController.deployment.enabled=false conflicts with deployment.installTraefikController=true"

  - it: fails when traefik subchart disables kubernetesCRD provider
    set:
      deployment.type: controller
      deployment.installTraefikController: true
      traefikController.providers.kubernetesCRD.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "praxis-081: traefikController.providers.kubernetesCRD.enabled=false is not supported (required by controller mode)"

  - it: fails when external mode has no Secret source configured
    set:
      database.mode: external
    asserts:
      - failedTemplate:
          errorMessage: "praxis-061: database.mode=external requires a database connection Secret. Either set database.connection.existingSecretName (user-managed Secret) or set database.external.generatedSecret.create=true with database.external.generatedSecret.connectionString or host/username/password/port/database values (chart-managed Secret)."

  - it: fails when dashboard ingressroute is enabled and host cannot be derived
    set:
      database.mode: sqlite
      praxis.config.app.dashboard_url: ""
      praxis.ingressRoute.dashboard.host: ""
      praxis.ingressRoute.dashboard.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "praxis-063: praxis.ingressRoute.dashboard.enabled=true requires a host. Set praxis.ingressRoute.dashboard.host or provide a parseable praxis.config.app.dashboard_url."

  - it: fails when dashboard ingressroute tls mode sets certResolver and secretName together
    set:
      praxis.ingressRoute.dashboard.tls.certResolver: letsencrypt
      praxis.ingressRoute.dashboard.tls.secretName: dashboard-tls
    asserts:
      - failedTemplate:
          errorMessage: "praxis-065: praxis.ingressRoute.dashboard.tls.certResolver and tls.secretName are mutually exclusive. Set exactly one TLS mode."

  - it: fails when cross-namespace ingressroute service references are not explicitly allowed
    set:
      praxis.ingressRoute.dashboard.routes.api.service.namespace: other-namespace
      praxis.ingressRoute.dashboard.allowCrossNamespaceServices: false
    asserts:
      - failedTemplate:
          errorMessage: "praxis-066: cross-namespace Traefik service references are disabled. Set praxis.ingressRoute.dashboard.allowCrossNamespaceServices=true to allow routes.api.service.namespace=\"other-namespace\" (Traefik kubernetesCRD provider must also allow cross-namespace references)."

  - it: fails when gerbil startupMode is invalid
    set:
      gerbil.startupMode: invalid
    asserts:
      - failedTemplate:
          errorMessage: "values don't meet the specifications of the schema(s) in the following chart(s):\npraxis:\n- at '/gerbil/startupMode': value must be one of 'normal', 'delayed', 'disabledUntilSetup'\n"

  - it: passes when external mode has existingSecretName configured
    set:
      database.mode: external
      database.connection.existingSecretName: my-db-secret
    asserts:
      - notFailedTemplate: {}

  - it: passes when external mode has generatedSecret.create=true configured
    set:
      database.mode: external
      database.external.generatedSecret.create: true
      database.external.generatedSecret.connectionString: "postgresql://u:p@h:5432/db"
    asserts:
      - notFailedTemplate: {}

  - it: fails when Kubernetes API egress is enabled with no destination
    set:
      database:
        mode: sqlite
      deployment:
        type: controller
        mode: multi
      networkPolicy:
        controller:
          egress:
            kubernetesApi:
              endpoints: []
    asserts:
      - failedTemplate:
          errorPattern: "praxis-067"


  - it: passes when Kubernetes API egress is explicitly opted out
    set:
      database:
        mode: sqlite
      deployment:
        type: controller
        mode: multi
      networkPolicy:
        controller:
          egress:
            kubernetesApi:
              enabled: false
              endpoints: []
    asserts:
      - notFailedTemplate: {}

  - it: passes when only the deprecated Kubernetes API cidr is configured
    set:
      database:
        mode: sqlite
      deployment:
        type: controller
        mode: multi
      networkPolicy:
        controller:
          egress:
            kubernetesApi:
              endpoints: []
              cidr: 10.43.0.1/32
    asserts:
      - notFailedTemplate: {}

  - it: accepts every documented gerbil startupMode
    set:
      database:
        mode: sqlite
      gerbil:
        startupMode: disabledUntilSetup
    asserts:
      - notFailedTemplate: {}

  - it: rejects an endpoint entry that carries no cidrs
    set:
      database:
        mode: sqlite
      deployment:
        type: controller
        mode: multi
      networkPolicy:
        enabled: true
        controller:
          egress:
            kubernetesApi:
              endpoints:
                - ports: [443]
    asserts:
      - failedTemplate:
          errorPattern: "praxis-067.*has no cidrs"

  - it: rejects an address without a prefix length
    set:
      database:
        mode: sqlite
      deployment:
        type: controller
        mode: multi
      networkPolicy:
        enabled: true
        controller:
          egress:
            kubernetesApi:
              endpoints:
                - cidrs: ["10.43.0.1"]
    asserts:
      - failedTemplate:
          errorPattern: "praxis-067.*not an address/prefix"

  - it: rejects a port outside the valid range
    set:
      database:
        mode: sqlite
      deployment:
        type: controller
        mode: multi
      networkPolicy:
        enabled: true
        controller:
          egress:
            kubernetesApi:
              endpoints:
                - cidrs: ["10.43.0.1/32"]
                  ports: [70000]
    asserts:
      - failedTemplate:
          errorPattern: "praxis-067.*outside 1-65535"

  - it: rejects except combined with more than one cidr
    set:
      database:
        mode: sqlite
      deployment:
        type: controller
        mode: multi
      networkPolicy:
        enabled: true
        controller:
          egress:
            kubernetesApi:
              endpoints:
                - cidrs: ["10.0.0.0/8", "192.168.0.0/16"]
                  except: ["10.1.0.0/16"]
    asserts:
      - failedTemplate:
          errorPattern: "praxis-067.*combines except with 2 cidrs"

  - it: rejects a relative SQLite path that would yield a relative mountPath
    set:
      database:
        mode: sqlite
        sqlite:
          path: data/praxis.db
          persistence:
            enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "praxis-068"

  - it: rejects a SQLite path with no mountable parent directory
    set:
      database:
        mode: sqlite
        sqlite:
          path: /praxis.db
          persistence:
            enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "praxis-068"

  - it: accepts a deeply nested absolute SQLite path
    set:
      database:
        mode: sqlite
        sqlite:
          path: /var/lib/praxis/nested/deep/p.db
          persistence:
            enabled: true
    asserts:
      - notFailedTemplate: {}

  - it: rejects more than one Praxis replica on a persisted SQLite database
    set:
      database:
        mode: sqlite
        sqlite:
          persistence:
            enabled: true
      praxis:
        replicaCount: 3
    asserts:
      - failedTemplate:
          errorPattern: "praxis-069"

  - it: allows more than one replica when SQLite is not in use
    set:
      praxis:
        replicaCount: 3
    asserts:
      - notFailedTemplate: {}

  - it: rejects an extraVolume that collides with the SQLite volume name
    set:
      database:
        mode: sqlite
        sqlite:
          persistence:
            enabled: true
      praxis:
        extraVolumes:
          - name: praxis-sqlite
            emptyDir: {}
    asserts:
      - failedTemplate:
          errorPattern: "praxis-070"

  - it: rejects an extraVolumeMount that collides with the SQLite mount path
    set:
      database:
        mode: sqlite
        sqlite:
          persistence:
            enabled: true
      praxis:
        extraVolumeMounts:
          - name: other
            mountPath: /app/data
    asserts:
      - failedTemplate:
          errorPattern: "praxis-070"

  - it: accepts extra volumes that do not collide with the SQLite volume
    set:
      database:
        mode: sqlite
        sqlite:
          persistence:
            enabled: true
      praxis:
        extraVolumes:
          - name: scratch
            emptyDir: {}
        extraVolumeMounts:
          - name: scratch
            mountPath: /scratch
    asserts:
      - notFailedTemplate: {}
