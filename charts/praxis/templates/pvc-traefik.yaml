{{- /* ACME state of the chart-managed Traefik. The Pods referenced
       `<fullname>-traefik-acme` whenever traefik.persistence.enabled=true, but nothing
       created it, so enabling persistence without existingClaim left Traefik Pending. */ -}}
{{- if eq (include "praxis.traefik.chartManagedAnyMode" .) "true" }}
{{- $tf := .Values.traefik -}}
{{- $persistence := $tf.persistence | default dict -}}
{{- if and $persistence.enabled (not $persistence.existingClaim) }}
{{- $root := . -}}
{{- $storageClass := $persistence.storageClass | default $root.Values.global.storageClass -}}
{{- $metaAnns := mergeOverwrite (dict) (include "praxis.global.commonAnnotations" $root | fromYaml) (include "praxis.component.commonAnnotations" (dict "root" $root "component" "traefik") | fromYaml) ($persistence.annotations | default dict) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "praxis.traefik.acmeClaimName" $root }}
  namespace: {{ include "praxis.namespace" $root }}
  labels:
    {{- include "praxis.labels" $root | nindent 4 }}
    {{- include "praxis.component.commonLabels" (dict "root" $root "component" "traefik") | nindent 4 }}
    app.kubernetes.io/component: traefik-standalone
  {{- if gt (len $metaAnns) 0 }}
  annotations:
    {{- toYaml $metaAnns | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml ($persistence.accessModes | default (list "ReadWriteOnce")) | nindent 4 }}
  {{- if $storageClass }}
  storageClassName: {{ $storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ $persistence.size | default "1Gi" }}
{{- end }}
{{- end }}
