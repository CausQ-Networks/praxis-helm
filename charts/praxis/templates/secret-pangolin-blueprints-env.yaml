{{- $bp := .Values.praxis.blueprints | default dict -}}
{{- $bpEnabled := default false (get $bp "enabled") -}}
{{- $bpEs := default (dict) (get $bp "environmentSecret") -}}
{{- $bpEsCreate := default false (get $bpEs "create") -}}
{{- $bpExistingEs := default "" (get $bp "existingEnvironmentSecret") -}}
{{- if and $bpEnabled $bpEsCreate (not $bpExistingEs) }}
{{- $metaAnns := mergeOverwrite (dict) (include "praxis.global.commonAnnotations" . | fromYaml) (include "praxis.component.commonAnnotations" (dict "root" . "component" "praxis") | fromYaml) (.Values.praxis.secret.annotations | default dict) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "praxis.blueprints.envSecretName" . }}
  namespace: {{ include "praxis.namespace" . }}
  labels:
    {{- include "praxis.labels" . | nindent 4 }}
    {{- include "praxis.component.commonLabels" (dict "root" . "component" "praxis") | nindent 4 }}
    {{- include "praxis.renderNonSelectorLabels" (dict "labels" (.Values.praxis.secret.labels | default dict)) | nindent 4 }}
    app.kubernetes.io/component: praxis
  {{- if gt (len $metaAnns) 0 }}
  annotations:
    {{- toYaml $metaAnns | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- range $k, $v := (get $bp "environment" | default dict) }}
  {{ $k | quote }}: {{ $v | quote }}
  {{- end }}
{{- end }}
