{{- if .Values.networkPolicy.enabled }}
{{- $root := . -}}
{{- $fullname := include "praxis.fullname" $root -}}
{{- $namespace := include "praxis.namespace" $root -}}
{{- $praxisNpAnns := mergeOverwrite (dict) (include "praxis.global.commonAnnotations" $root | fromYaml) (include "praxis.component.commonAnnotations" (dict "root" $root "component" "praxis") | fromYaml) -}}
{{- $controllerNpAnns := mergeOverwrite (dict) (include "praxis.global.commonAnnotations" $root | fromYaml) (include "praxis.component.commonAnnotations" (dict "root" $root "component" "controller") | fromYaml) -}}
{{- $gerbilNpAnns := mergeOverwrite (dict) (include "praxis.global.commonAnnotations" $root | fromYaml) (include "praxis.component.commonAnnotations" (dict "root" $root "component" "gerbil") | fromYaml) -}}
{{- $embeddedNpAnns := mergeOverwrite (dict) (include "praxis.global.commonAnnotations" $root | fromYaml) (($root.Values.database.embedded.commonAnnotations) | default dict) -}}
{{- $allowExternal := true -}}
{{- if kindIs "bool" $root.Values.networkPolicy.allowExternalIngress -}}
{{- $allowExternal = $root.Values.networkPolicy.allowExternalIngress -}}
{{- end -}}
{{- $allowHttpsEgress := (default false $root.Values.networkPolicy.allowExternalEgressHttps) -}}
{{- $extraIngress := $root.Values.networkPolicy.extraIngress | default list -}}
{{- $extraEgress := $root.Values.networkPolicy.extraEgress | default list -}}
{{- $legacyKubeApiCidrs := $root.Values.networkPolicy.kubernetesApiCIDRs | default list -}}

{{- $npDns := $root.Values.networkPolicy.dns | default dict -}}
{{- $dnsEnabled := true -}}
{{- if hasKey $npDns "enabled" -}}
{{- $dnsEnabled = $npDns.enabled -}}
{{- end -}}
{{- $dnsPorts := $npDns.ports | default (list (dict "protocol" "UDP" "port" 53) (dict "protocol" "TCP" "port" 53)) -}}
{{- $dnsTo := $npDns.to | default (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" "kube-system")))) -}}
{{- $dnsEgress := dict "to" $dnsTo "ports" $dnsPorts -}}

{{- $npPraxis := $root.Values.networkPolicy.praxis | default dict -}}
{{- $npPraxisIngress := $npPraxis.ingress | default dict -}}
{{- $npPraxisDashboardIngress := $npPraxisIngress.dashboard | default dict -}}
{{- $praxisDashboardFrom := $npPraxisDashboardIngress.from | default list -}}
{{- $npPraxisAiGatewayIngress := $npPraxisIngress.aiGateway | default dict -}}
{{- $aiGatewayFromTraefik := true -}}
{{- if kindIs "bool" $npPraxisAiGatewayIngress.fromTraefik -}}
{{- $aiGatewayFromTraefik = $npPraxisAiGatewayIngress.fromTraefik -}}
{{- end -}}
{{- $aiGatewayExtraFrom := $npPraxisAiGatewayIngress.from | default list -}}
{{- $npPraxisExternal := $npPraxis.externalIngress | default dict -}}
{{- $allowPraxisExternal := true -}}
{{- if kindIs "bool" $npPraxisExternal.external -}}
{{- $allowPraxisExternal = $npPraxisExternal.external -}}
{{- end -}}
{{- /*
`next` is the Next.js dashboard port. ingressroute-dashboard.yaml routes every
request that is not the API PathPrefix to it and is enabled by default, so a flat
`false` blocked the chart's own default dashboard route (#22). Derive it from that
route instead of flipping the default to true: that keeps the port closed in
standalone mode and whenever the dashboard route is turned off, and the two cannot
drift apart again. An explicit boolean still wins - tested with `kindIs` rather
than `hasKey` because the value is present-but-null by default.
*/ -}}
{{- $dashboardRouteOpensNext := false -}}
{{- if eq $root.Values.deployment.type "controller" -}}
{{- $irDashboard := (($root.Values.praxis).ingressRoute | default dict).dashboard | default dict -}}
{{- $irEnabled := true -}}
{{- if hasKey $irDashboard "enabled" -}}
{{- $irEnabled = $irDashboard.enabled -}}
{{- end -}}
{{- $irDashboardRoute := ($irDashboard.routes | default dict).dashboard | default dict -}}
{{- $irRouteEnabled := true -}}
{{- if hasKey $irDashboardRoute "enabled" -}}
{{- $irRouteEnabled = $irDashboardRoute.enabled -}}
{{- end -}}
{{- $irRoutePort := ($irDashboardRoute.service | default dict).port | default $root.Values.praxis.service.ports.next -}}
{{- $dashboardRouteOpensNext = and $irEnabled $irRouteEnabled (eq (printf "%v" $irRoutePort) (printf "%v" $root.Values.praxis.service.ports.next)) -}}
{{- end -}}
{{- $allowPraxisNext := $dashboardRouteOpensNext -}}
{{- if kindIs "bool" $npPraxisExternal.next -}}
{{- $allowPraxisNext = $npPraxisExternal.next -}}
{{- end -}}
{{- $allowPraxisIntegration := (default false $npPraxisExternal.integration) -}}
{{- $allowPraxisAiGateway := (default false $npPraxisExternal.aiGateway) -}}
{{- $requireIntegrationFlag := true -}}
{{- if kindIs "bool" $npPraxisExternal.requireIntegrationFlag -}}
{{- $requireIntegrationFlag = $npPraxisExternal.requireIntegrationFlag -}}
{{- end -}}
{{- $praxisExtraIngress := $npPraxis.extraIngress | default list -}}
{{- $praxisExtraEgress := $npPraxis.extraEgress | default list -}}

{{- $npController := $root.Values.networkPolicy.controller | default dict -}}
{{- $npControllerMetrics := $npController.metrics | default dict -}}
{{- $controllerMetricsEnabled := (default false $npControllerMetrics.enabled) -}}
{{- $controllerMetricsFrom := $npControllerMetrics.from | default list -}}
{{- $allowControllerMetricsExternal := (default false $npControllerMetrics.allowExternalIngress) -}}
{{- $controllerMetricsNamespaceSelector := $npControllerMetrics.namespaceSelector | default dict -}}
{{- $controllerMetricsPodSelector := $npControllerMetrics.podSelector | default dict -}}
{{- $npControllerEgress := $npController.egress | default dict -}}
{{- $controllerEgressEnabled := true -}}
{{- if hasKey $npControllerEgress "enabled" -}}
{{- $controllerEgressEnabled = $npControllerEgress.enabled -}}
{{- end -}}
{{- $npControllerKubernetesApi := $npControllerEgress.kubernetesApi | default dict -}}
{{- $controllerKubernetesApiEnabled := true -}}
{{- if hasKey $npControllerKubernetesApi "enabled" -}}
{{- $controllerKubernetesApiEnabled = $npControllerKubernetesApi.enabled -}}
{{- end -}}
{{- $controllerKubernetesApiPort := (default 443 $npControllerKubernetesApi.port) -}}
{{- $controllerLegacyKubeApiCidrs := list -}}
{{- if $npControllerKubernetesApi.cidr -}}
{{- $controllerLegacyKubeApiCidrs = append $controllerLegacyKubeApiCidrs $npControllerKubernetesApi.cidr -}}
{{- end -}}
{{- if gt (len $legacyKubeApiCidrs) 0 -}}
{{- $controllerLegacyKubeApiCidrs = concat $controllerLegacyKubeApiCidrs $legacyKubeApiCidrs -}}
{{- end -}}
{{- /*
Build the Kubernetes API egress rules. The deprecated single `cidr` and the
deprecated top-level `kubernetesApiCIDRs` list win outright over `endpoints`:
widening an operator's scoped allow-list during an upgrade would be a security
regression, so an existing narrow configuration is carried over untouched.
*/ -}}
{{- $controllerKubeApiRules := list -}}
{{- if gt (len $controllerLegacyKubeApiCidrs) 0 -}}
{{- $legacyTo := list -}}
{{- range $cidr := $controllerLegacyKubeApiCidrs -}}
{{- $legacyTo = append $legacyTo (dict "ipBlock" (dict "cidr" $cidr)) -}}
{{- end -}}
{{- $controllerKubeApiRules = append $controllerKubeApiRules (dict "to" $legacyTo "ports" (list (dict "protocol" "TCP" "port" $controllerKubernetesApiPort))) -}}
{{- else -}}
{{- range $endpoint := ($npControllerKubernetesApi.endpoints | default list) -}}
{{- $endpointCidrs := $endpoint.cidrs | default list -}}
{{- if gt (len $endpointCidrs) 0 -}}
{{- $endpointTo := list -}}
{{- range $cidr := $endpointCidrs -}}
{{- $ipBlock := dict "cidr" $cidr -}}
{{- if gt (len ($endpoint.except | default list)) 0 -}}
{{- $_ := set $ipBlock "except" $endpoint.except -}}
{{- end -}}
{{- $endpointTo = append $endpointTo (dict "ipBlock" $ipBlock) -}}
{{- end -}}
{{- $endpointPorts := list -}}
{{- range $port := ($endpoint.ports | default (list 443)) -}}
{{- $endpointPorts = append $endpointPorts (dict "protocol" "TCP" "port" $port) -}}
{{- end -}}
{{- $controllerKubeApiRules = append $controllerKubeApiRules (dict "to" $endpointTo "ports" $endpointPorts) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $controllerExtraIngress := $npController.extraIngress | default list -}}
{{- $controllerExtraEgress := $npController.extraEgress | default list -}}

{{- $npDatabase := $root.Values.networkPolicy.database | default dict -}}
{{- $allowDatabaseEgress := true -}}
{{- if kindIs "bool" $npDatabase.enabled -}}
{{- $allowDatabaseEgress = $npDatabase.enabled -}}
{{- end -}}
{{- $databasePort := (default 5432 $npDatabase.port) -}}
{{- $databaseCnpgPeers := $npDatabase.cnpgPeers | default list -}}
{{- $databaseExternalCidrs := $npDatabase.externalCIDRs | default list -}}
{{- $databaseExtraIngress := $npDatabase.extraIngress | default list -}}
{{- $databaseExtraEgress := $npDatabase.extraEgress | default list -}}

{{- $npGerbil := $root.Values.networkPolicy.gerbil | default dict -}}
{{- $allowGerbilWireguardUdpEgress := true -}}
{{- if kindIs "bool" $npGerbil.allowWireguardUdpEgress -}}
{{- $allowGerbilWireguardUdpEgress = $npGerbil.allowWireguardUdpEgress -}}
{{- end -}}
{{- $gerbilWireguardUdpCidrs := $npGerbil.wireguardUdpCIDRs | default (list "0.0.0.0/0") -}}
{{- $gerbilExtraIngress := $npGerbil.extraIngress | default list -}}
{{- $gerbilExtraEgress := $npGerbil.extraEgress | default list -}}

{{- $singleMode := eq $root.Values.deployment.mode "single" -}}
{{- $renderPraxis := true -}}
{{- $renderController := and $root.Values.controller.enabled (eq $root.Values.deployment.type "controller") -}}
{{- $renderGerbil := eq (include "praxis.gerbil.resourcesEnabled" $root) "true" -}}
{{- $renderEmbeddedPostgres := and (eq $root.Values.database.mode "embedded") $root.Values.database.embedded.enabled -}}

{{- $selSingle := dict "app.kubernetes.io/name" (include "praxis.name" $root) "app.kubernetes.io/instance" $root.Release.Name "app.kubernetes.io/component" "single" -}}
{{- $selPraxis := ternary $selSingle (dict "app.kubernetes.io/name" (include "praxis.name" $root) "app.kubernetes.io/instance" $root.Release.Name "app.kubernetes.io/component" "praxis") $singleMode -}}
{{- $selController := ternary $selSingle (dict "app.kubernetes.io/name" (include "praxis.name" $root) "app.kubernetes.io/instance" $root.Release.Name "app.kubernetes.io/component" "controller") $singleMode -}}
{{- $selGerbil := ternary $selSingle (dict "app.kubernetes.io/name" (include "praxis.name" $root) "app.kubernetes.io/instance" $root.Release.Name "app.kubernetes.io/component" "gerbil") $singleMode -}}
{{- $selEmbeddedPostgres := dict "app.kubernetes.io/name" (include "praxis.name" $root) "app.kubernetes.io/instance" $root.Release.Name "app.kubernetes.io/component" "embedded-postgres" -}}
{{- $traefikInGerbil := eq (include "praxis.traefik.inGerbilPod" $root) "true" -}}
{{- $selTraefik := ternary $selGerbil (dict "app.kubernetes.io/name" (include "praxis.name" $root) "app.kubernetes.io/instance" $root.Release.Name "app.kubernetes.io/component" "traefik-standalone") $traefikInGerbil -}}

{{- if $renderPraxis -}}
{{- $praxisIngress := list -}}
{{- if $renderController -}}
{{- $praxisIngress = append $praxisIngress (dict "from" (list (dict "podSelector" (dict "matchLabels" $selController))) "ports" (list (dict "protocol" "TCP" "port" $root.Values.praxis.service.ports.internalApi))) -}}
{{- end -}}
{{- if $renderGerbil -}}
{{- /*
A hostNetwork Pod is not matched by a podSelector on any mainstream CNI: its traffic
sources from the node IP. In host gateway mode this rule therefore has to be expressed
as node address blocks, otherwise Gerbil's --remoteConfig polling is blackholed by this
chart's own default policy.
*/ -}}
{{- if eq (include "praxis.gerbil.hostGateway.enabled" $root) "true" -}}
{{- $gerbilNodeFrom := list -}}
{{- range $cidr := ((($npGerbil.hostGateway) | default dict).nodeCIDRs | default list) -}}
{{- $gerbilNodeFrom = append $gerbilNodeFrom (dict "ipBlock" (dict "cidr" $cidr)) -}}
{{- end -}}
{{- $praxisIngress = append $praxisIngress (dict "from" $gerbilNodeFrom "ports" (list (dict "protocol" "TCP" "port" $root.Values.praxis.service.ports.internalApi))) -}}
{{- else -}}
{{- $praxisIngress = append $praxisIngress (dict "from" (list (dict "podSelector" (dict "matchLabels" $selGerbil))) "ports" (list (dict "protocol" "TCP" "port" $root.Values.praxis.service.ports.internalApi))) -}}
{{- end -}}
{{- end -}}
{{- /* A chart-managed Traefik polls the generated configuration from the same internal API
       port. Without this rule the HTTP provider is blackholed by the chart's own policy and
       Traefik serves nothing Praxis generated. */ -}}
{{- if and (eq (include "praxis.traefik.chartManagedAnyMode" $root) "true") (eq (include "praxis.traefik.httpProviderEnabled" $root) "true") (not $singleMode) -}}
{{- $praxisIngress = append $praxisIngress (dict "from" (list (dict "podSelector" (dict "matchLabels" $selTraefik))) "ports" (list (dict "protocol" "TCP" "port" $root.Values.praxis.service.ports.internalApi))) -}}
{{- end -}}
{{- /*
The AI gateway port is reached by Traefik, not by the cluster at large: every AI
gateway resource is a route Traefik terminates and forwards here. Build the rule from
the Traefik this chart can actually identify, and let an external one be named
explicitly. Opening the port to every source instead would hand any Pod in the cluster
the model providers behind the gateway and the virtual API keys that pay for them.

Single mode needs no rule: Traefik runs in the Praxis Pod and reaches the gateway
over loopback, which NetworkPolicy does not govern.
*/ -}}
{{- $aiGatewayFrom := list -}}
{{- if $aiGatewayFromTraefik -}}
{{- if and (eq (include "praxis.traefik.chartManagedAnyMode" $root) "true") (not $singleMode) -}}
{{- $aiGatewayFrom = append $aiGatewayFrom (dict "podSelector" (dict "matchLabels" $selTraefik)) -}}
{{- end -}}
{{- /* The bundled subchart names its Pods itself. Both labels are its immutable
       selector, so they are derived the same way it derives them: the alias never
       reaches them, and `namespaceOverride` is the only thing that can move the Pods
       out of this namespace. */ -}}
{{- if $root.Values.deployment.installTraefikController -}}
{{- $bundled := $root.Values.traefikController | default dict -}}
{{- $bundledNs := $bundled.namespaceOverride | default $root.Release.Namespace -}}
{{- $bundledPeer := dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" ($bundled.nameOverride | default "traefik") "app.kubernetes.io/instance" ($bundled.instanceLabelOverride | default (printf "%s-%s" $root.Release.Name $bundledNs)))) -}}
{{- if ne $bundledNs $namespace -}}
{{- $_ := set $bundledPeer "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $bundledNs)) -}}
{{- end -}}
{{- $aiGatewayFrom = append $aiGatewayFrom $bundledPeer -}}
{{- end -}}
{{- end -}}
{{- if gt (len $aiGatewayExtraFrom) 0 -}}
{{- $aiGatewayFrom = concat $aiGatewayFrom $aiGatewayExtraFrom -}}
{{- end -}}
{{- if gt (len $aiGatewayFrom) 0 -}}
{{- $praxisIngress = append $praxisIngress (dict "from" $aiGatewayFrom "ports" (list (dict "protocol" "TCP" "port" $root.Values.praxis.service.ports.aiGateway))) -}}
{{- end -}}
{{- if $allowExternal -}}
{{- if $allowPraxisExternal -}}
{{- $praxisExternalIngress := dict "ports" (list (dict "protocol" "TCP" "port" $root.Values.praxis.service.ports.external)) -}}
{{- if gt (len $praxisDashboardFrom) 0 -}}
{{- $_ := set $praxisExternalIngress "from" $praxisDashboardFrom -}}
{{- end -}}
{{- $praxisIngress = append $praxisIngress $praxisExternalIngress -}}
{{- end -}}
{{- if $allowPraxisNext -}}
{{- $praxisNextIngress := dict "ports" (list (dict "protocol" "TCP" "port" $root.Values.praxis.service.ports.next)) -}}
{{- if gt (len $praxisDashboardFrom) 0 -}}
{{- $_ := set $praxisNextIngress "from" $praxisDashboardFrom -}}
{{- end -}}
{{- $praxisIngress = append $praxisIngress $praxisNextIngress -}}
{{- end -}}
{{- if and $allowPraxisIntegration (or (not $requireIntegrationFlag) (($root.Values.praxis.config | default dict).flags | default dict).enable_integration_api) -}}
{{- $praxisIngress = append $praxisIngress (dict "ports" (list (dict "protocol" "TCP" "port" $root.Values.praxis.service.ports.integration))) -}}
{{- end -}}
{{- /* Opt-in only: a rule with no `from` is every source. */ -}}
{{- if $allowPraxisAiGateway -}}
{{- $praxisIngress = append $praxisIngress (dict "ports" (list (dict "protocol" "TCP" "port" $root.Values.praxis.service.ports.aiGateway))) -}}
{{- end -}}
{{- end -}}
{{- if $extraIngress -}}
{{- $praxisIngress = concat $praxisIngress $extraIngress -}}
{{- end -}}
{{- if $praxisExtraIngress -}}
{{- $praxisIngress = concat $praxisIngress $praxisExtraIngress -}}
{{- end -}}

{{- $praxisEgress := list -}}
{{- if $dnsEnabled -}}
{{- $praxisEgress = append $praxisEgress $dnsEgress -}}
{{- end -}}
{{- if $allowDatabaseEgress -}}
{{- if $renderEmbeddedPostgres -}}
{{- $praxisEgress = append $praxisEgress (dict "to" (list (dict "podSelector" (dict "matchLabels" $selEmbeddedPostgres))) "ports" (list (dict "protocol" "TCP" "port" ($root.Values.database.embedded.service.port | default 5432)))) -}}
{{- else if eq $root.Values.database.mode "cloudnativepg" -}}
{{- if gt (len $databaseCnpgPeers) 0 -}}
{{- $praxisEgress = append $praxisEgress (dict "to" $databaseCnpgPeers "ports" (list (dict "protocol" "TCP" "port" $databasePort))) -}}
{{- else -}}
{{- $cnpgCluster := ($root.Values.database.cloudnativepg | default dict).cluster | default dict -}}
{{- $cnpgClusterName := $cnpgCluster.name | default "praxis-db" -}}
{{- $cnpgClusterNs := $cnpgCluster.namespace | default "" -}}
{{- $cnpgPeer := dict "podSelector" (dict "matchLabels" (dict "cnpg.io/cluster" $cnpgClusterName)) -}}
{{- if and $cnpgClusterNs (ne $cnpgClusterNs $namespace) -}}
{{- $_ := set $cnpgPeer "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $cnpgClusterNs)) -}}
{{- end -}}
{{- $praxisEgress = append $praxisEgress (dict "to" (list $cnpgPeer) "ports" (list (dict "protocol" "TCP" "port" $databasePort))) -}}
{{- end -}}
{{- else if and (eq $root.Values.database.mode "external") (gt (len $databaseExternalCidrs) 0) -}}
{{- $externalDbTo := list -}}
{{- range $cidr := $databaseExternalCidrs -}}
{{- $externalDbTo = append $externalDbTo (dict "ipBlock" (dict "cidr" $cidr)) -}}
{{- end -}}
{{- $praxisEgress = append $praxisEgress (dict "to" $externalDbTo "ports" (list (dict "protocol" "TCP" "port" $databasePort))) -}}
{{- end -}}
{{- end -}}
{{- if $allowHttpsEgress -}}
{{- $praxisEgress = append $praxisEgress (dict "to" (list (dict "ipBlock" (dict "cidr" "0.0.0.0/0"))) "ports" (list (dict "protocol" "TCP" "port" 443))) -}}
{{- end -}}
{{- /* Praxis pushes every peer to Gerbil's HTTP API (POST /peer on site and client
       registration). Without this rule no tunnel can come up (#39). Single mode needs
       none: Gerbil shares the Pod and is reached over loopback. */ -}}
{{- if and $renderGerbil (not $singleMode) -}}
{{- $gerbilApiPort := $root.Values.gerbil.ports.internalApi | default 3004 -}}
{{- if eq (include "praxis.gerbil.hostGateway.enabled" $root) "true" -}}
{{- $gerbilNodeTo := list -}}
{{- range $cidr := ((($npGerbil.hostGateway) | default dict).nodeCIDRs | default list) -}}
{{- $gerbilNodeTo = append $gerbilNodeTo (dict "ipBlock" (dict "cidr" $cidr)) -}}
{{- end -}}
{{- if gt (len $gerbilNodeTo) 0 -}}
{{- $praxisEgress = append $praxisEgress (dict "to" $gerbilNodeTo "ports" (list (dict "protocol" "TCP" "port" $gerbilApiPort))) -}}
{{- end -}}
{{- else -}}
{{- $praxisEgress = append $praxisEgress (dict "to" (list (dict "podSelector" (dict "matchLabels" $selGerbil))) "ports" (list (dict "protocol" "TCP" "port" $gerbilApiPort))) -}}
{{- end -}}
{{- end -}}
{{- if $extraEgress -}}
{{- $praxisEgress = concat $praxisEgress $extraEgress -}}
{{- end -}}
{{- if $praxisExtraEgress -}}
{{- $praxisEgress = concat $praxisEgress $praxisExtraEgress -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-praxis-ingress
  namespace: {{ $namespace }}
  labels:
    {{- include "praxis.labels" $root | nindent 4 }}
    {{- include "praxis.component.commonLabels" (dict "root" $root "component" "praxis") | nindent 4 }}
    app.kubernetes.io/component: praxis
  {{- if gt (len $praxisNpAnns) 0 }}
  annotations:
    {{- toYaml $praxisNpAnns | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $selPraxis | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if gt (len $praxisIngress) 0 }}
  ingress:
    {{- toYaml $praxisIngress | nindent 4 }}
  {{- else }}
  ingress: []
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-praxis-egress
  namespace: {{ $namespace }}
  labels:
    {{- include "praxis.labels" $root | nindent 4 }}
    {{- include "praxis.component.commonLabels" (dict "root" $root "component" "praxis") | nindent 4 }}
    app.kubernetes.io/component: praxis
  {{- if gt (len $praxisNpAnns) 0 }}
  annotations:
    {{- toYaml $praxisNpAnns | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $selPraxis | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- toYaml $praxisEgress | nindent 4 }}
{{- end }}

{{ if $renderController }}
{{- $controllerIngress := list -}}
{{- if and $allowExternal $allowControllerMetricsExternal -}}
{{- $controllerIngress = append $controllerIngress (dict "ports" (list (dict "protocol" "TCP" "port" ($root.Values.controller.service.port | default 9090)))) -}}
{{- else if $controllerMetricsEnabled -}}
{{- if gt (len $controllerMetricsFrom) 0 -}}
{{- $controllerIngress = append $controllerIngress (dict "from" $controllerMetricsFrom "ports" (list (dict "protocol" "TCP" "port" ($root.Values.controller.service.port | default 9090)))) -}}
{{- else -}}
{{- $controllerMetricsPeer := dict -}}
{{- if gt (len $controllerMetricsNamespaceSelector) 0 -}}
{{- $_ := set $controllerMetricsPeer "namespaceSelector" $controllerMetricsNamespaceSelector -}}
{{- end -}}
{{- if gt (len $controllerMetricsPodSelector) 0 -}}
{{- $_ := set $controllerMetricsPeer "podSelector" $controllerMetricsPodSelector -}}
{{- end -}}
{{- if gt (len $controllerMetricsPeer) 0 -}}
{{- $controllerIngress = append $controllerIngress (dict "from" (list $controllerMetricsPeer) "ports" (list (dict "protocol" "TCP" "port" ($root.Values.controller.service.port | default 9090)))) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $controllerEgress := list -}}
{{- if $dnsEnabled -}}
{{- $controllerEgress = append $controllerEgress $dnsEgress -}}
{{- end -}}
{{- if $renderPraxis -}}
{{- $controllerEgress = append $controllerEgress (dict "to" (list (dict "podSelector" (dict "matchLabels" $selPraxis))) "ports" (list (dict "protocol" "TCP" "port" $root.Values.praxis.service.ports.internalApi))) -}}
{{- end -}}
{{- if $controllerKubernetesApiEnabled -}}
{{- $controllerEgress = concat $controllerEgress $controllerKubeApiRules -}}
{{- end -}}
{{- if $extraEgress -}}
{{- $controllerEgress = concat $controllerEgress $extraEgress -}}
{{- end -}}
{{- if $controllerExtraIngress -}}
{{- $controllerIngress = concat $controllerIngress $controllerExtraIngress -}}
{{- end -}}
{{- if $controllerExtraEgress -}}
{{- $controllerEgress = concat $controllerEgress $controllerExtraEgress -}}
{{- end -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-controller-ingress
  namespace: {{ $namespace }}
  labels:
    {{- include "praxis.labels" $root | nindent 4 }}
    {{- include "praxis.component.commonLabels" (dict "root" $root "component" "controller") | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- if gt (len $controllerNpAnns) 0 }}
  annotations:
    {{- toYaml $controllerNpAnns | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $selController | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if gt (len $controllerIngress) 0 }}
  ingress:
    {{- toYaml $controllerIngress | nindent 4 }}
  {{- else }}
  ingress: []
  {{- end }}
{{- if and $controllerEgressEnabled (gt (len $controllerEgress) 0) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-controller-egress
  namespace: {{ $namespace }}
  labels:
    {{- include "praxis.labels" $root | nindent 4 }}
    {{- include "praxis.component.commonLabels" (dict "root" $root "component" "controller") | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- if gt (len $controllerNpAnns) 0 }}
  annotations:
    {{- toYaml $controllerNpAnns | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $selController | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- toYaml $controllerEgress | nindent 4 }}
{{- end }}
{{- end }}

{{ if $renderGerbil }}
{{- $gerbilIngress := list -}}
{{- if $allowExternal -}}
{{- $gerbilIngress = append $gerbilIngress (dict "ports" (list (dict "protocol" "UDP" "port" $root.Values.gerbil.ports.wg1) (dict "protocol" "UDP" "port" $root.Values.gerbil.ports.wg2))) -}}
{{- end -}}
{{- /* The chart-managed Traefik runs in this Pod and is the public entry point. A
       Traefik in its own Deployment has no policy at all, so this keeps the same reach. */ -}}
{{- if $traefikInGerbil -}}
{{- $gerbilIngress = append $gerbilIngress (dict "ports" (list (dict "protocol" "TCP" "port" 8000) (dict "protocol" "TCP" "port" (include "praxis.traefik.websecurePort" $root | int)))) -}}
{{- end -}}
{{- $internalApiFrom := list -}}
{{- if $renderPraxis -}}
{{- $internalApiFrom = append $internalApiFrom (dict "podSelector" (dict "matchLabels" $selPraxis)) -}}
{{- end -}}
{{- if $renderController -}}
{{- $internalApiFrom = append $internalApiFrom (dict "podSelector" (dict "matchLabels" $selController)) -}}
{{- end -}}
{{- if gt (len $internalApiFrom) 0 -}}
{{- $gerbilIngress = append $gerbilIngress (dict "from" $internalApiFrom "ports" (list (dict "protocol" "TCP" "port" ($root.Values.gerbil.ports.internalApi | default 3004)))) -}}
{{- end -}}

{{- $gerbilEgress := list -}}
{{- if $dnsEnabled -}}
{{- $gerbilEgress = append $gerbilEgress $dnsEgress -}}
{{- end -}}
{{- if $renderPraxis -}}
{{- $gerbilEgress = append $gerbilEgress (dict "to" (list (dict "podSelector" (dict "matchLabels" $selPraxis))) "ports" (list (dict "protocol" "TCP" "port" $root.Values.praxis.service.ports.internalApi))) -}}
{{- end -}}
{{- if $allowGerbilWireguardUdpEgress -}}
{{- $gerbilWireguardTo := list -}}
{{- range $cidr := $gerbilWireguardUdpCidrs -}}
{{- $gerbilWireguardTo = append $gerbilWireguardTo (dict "ipBlock" (dict "cidr" $cidr)) -}}
{{- end -}}
{{- if gt (len $gerbilWireguardTo) 0 -}}
{{- $gerbilEgress = append $gerbilEgress (dict "to" $gerbilWireguardTo "ports" (list (dict "protocol" "UDP" "port" $root.Values.gerbil.ports.wg1) (dict "protocol" "UDP" "port" $root.Values.gerbil.ports.wg2))) -}}
{{- end -}}
{{- end -}}
{{- if $allowHttpsEgress -}}
{{- $gerbilEgress = append $gerbilEgress (dict "to" (list (dict "ipBlock" (dict "cidr" "0.0.0.0/0"))) "ports" (list (dict "protocol" "TCP" "port" 443))) -}}
{{- end -}}
{{- if $extraEgress -}}
{{- $gerbilEgress = concat $gerbilEgress $extraEgress -}}
{{- end -}}
{{- if $gerbilExtraIngress -}}
{{- $gerbilIngress = concat $gerbilIngress $gerbilExtraIngress -}}
{{- end -}}
{{- if $gerbilExtraEgress -}}
{{- $gerbilEgress = concat $gerbilEgress $gerbilExtraEgress -}}
{{- end -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-gerbil-ingress
  namespace: {{ $namespace }}
  labels:
    {{- include "praxis.labels" $root | nindent 4 }}
    {{- include "praxis.component.commonLabels" (dict "root" $root "component" "gerbil") | nindent 4 }}
    app.kubernetes.io/component: gerbil
  {{- if gt (len $gerbilNpAnns) 0 }}
  annotations:
    {{- toYaml $gerbilNpAnns | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $selGerbil | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if gt (len $gerbilIngress) 0 }}
  ingress:
    {{- toYaml $gerbilIngress | nindent 4 }}
  {{- else }}
  ingress: []
  {{- end }}
{{- /* No egress policy while Traefik shares the Pod: it has to reach every backend a
       resource can point at (local and LAN targets, cluster Services, the Kubernetes API,
       ACME and plugin downloads), none of which can be enumerated here. A Traefik in its
       own Deployment is not restricted either. */}}
{{- if not $traefikInGerbil }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-gerbil-egress
  namespace: {{ $namespace }}
  labels:
    {{- include "praxis.labels" $root | nindent 4 }}
    {{- include "praxis.component.commonLabels" (dict "root" $root "component" "gerbil") | nindent 4 }}
    app.kubernetes.io/component: gerbil
  {{- if gt (len $gerbilNpAnns) 0 }}
  annotations:
    {{- toYaml $gerbilNpAnns | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $selGerbil | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- toYaml $gerbilEgress | nindent 4 }}
{{- end }}
{{- end }}

{{ if $renderEmbeddedPostgres }}
{{- $embeddedIngress := list -}}
{{- if $renderPraxis -}}
{{- $embeddedIngress = append $embeddedIngress (dict "from" (list (dict "podSelector" (dict "matchLabels" $selPraxis))) "ports" (list (dict "protocol" "TCP" "port" ($root.Values.database.embedded.service.port | default 5432)))) -}}
{{- end -}}
{{- if $databaseExtraIngress -}}
{{- $embeddedIngress = concat $embeddedIngress $databaseExtraIngress -}}
{{- end -}}
{{- $embeddedEgress := list -}}
{{- if $dnsEnabled -}}
{{- $embeddedEgress = append $embeddedEgress $dnsEgress -}}
{{- end -}}
{{- if $databaseExtraEgress -}}
{{- $embeddedEgress = concat $embeddedEgress $databaseExtraEgress -}}
{{- end -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-embedded-postgres-ingress
