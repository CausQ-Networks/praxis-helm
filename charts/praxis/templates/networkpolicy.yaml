apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-embedded-postgres-egress
  namespace: {{ $namespace }}
  labels:
    {{- include "praxis.labels" $root | nindent 4 }}
    {{- include "praxis.renderNonSelectorLabels" (dict "labels" (($root.Values.database.embedded.commonLabels) | default dict)) | nindent 4 }}
    app.kubernetes.io/component: embedded-postgres
  {{- if gt (len $embeddedNpAnns) 0 }}
  annotations:
    {{- toYaml $embeddedNpAnns | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $selEmbeddedPostgres | nindent 6 }}
  policyTypes:
    - Egress
  {{- if gt (len $embeddedEgress) 0 }}
  egress:
