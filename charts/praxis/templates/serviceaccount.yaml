{{- $root := . }}
{{- if .Values.serviceAccount.praxis.create }}
{{- $praxisSaAnns := mergeOverwrite (dict) (include "praxis.global.commonAnnotations" $root | fromYaml) (include "praxis.component.commonAnnotations" (dict "root" $root "component" "praxis") | fromYaml) (.Values.serviceAccount.praxis.annotations | default dict) (.Values.praxis.serviceAccount.annotations | default dict) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "praxis.serviceAccountName" . }}
  namespace: {{ include "praxis.namespace" . }}
  labels:
    {{- include "praxis.labels" . | nindent 4 }}
    {{- include "praxis.component.commonLabels" (dict "root" . "component" "praxis") | nindent 4 }}
    {{- include "praxis.renderNonSelectorLabels" (dict "labels" (.Values.serviceAccount.praxis.labels | default dict)) | nindent 4 }}
    {{- include "praxis.renderNonSelectorLabels" (dict "labels" (.Values.praxis.serviceAccount.labels | default dict)) | nindent 4 }}
    app.kubernetes.io/component: praxis
  {{- if gt (len $praxisSaAnns) 0 }}
  annotations:
    {{- toYaml $praxisSaAnns | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.praxis.automountServiceAccountToken }}
{{- end }}
{{- if and .Values.serviceAccount.gerbil.create (eq (include "praxis.gerbil.resourcesEnabled" .) "true") }}
---
{{- $gerbilSaAnns := mergeOverwrite (dict) (include "praxis.global.commonAnnotations" $root | fromYaml) (include "praxis.component.commonAnnotations" (dict "root" $root "component" "gerbil") | fromYaml) (.Values.serviceAccount.gerbil.annotations | default dict) (.Values.gerbil.serviceAccount.annotations | default dict) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "praxis.serviceAccountName.gerbil" . }}
  namespace: {{ include "praxis.namespace" . }}
  labels:
    {{- include "praxis.labels" . | nindent 4 }}
    {{- include "praxis.component.commonLabels" (dict "root" . "component" "gerbil") | nindent 4 }}
    {{- include "praxis.renderNonSelectorLabels" (dict "labels" (.Values.serviceAccount.gerbil.labels | default dict)) | nindent 4 }}
    {{- include "praxis.renderNonSelectorLabels" (dict "labels" (.Values.gerbil.serviceAccount.labels | default dict)) | nindent 4 }}
    app.kubernetes.io/component: gerbil
  {{- if gt (len $gerbilSaAnns) 0 }}
  annotations:
    {{- toYaml $gerbilSaAnns | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.gerbil.automountServiceAccountToken }}
{{- end }}
{{- if and .Values.serviceAccount.controller.create .Values.controller.enabled (eq .Values.deployment.type "controller") }}
---
{{- $controllerSaAnns := mergeOverwrite (dict) (include "praxis.global.commonAnnotations" $root | fromYaml) (include "praxis.component.commonAnnotations" (dict "root" $root "component" "controller") | fromYaml) (.Values.serviceAccount.controller.annotations | default dict) (.Values.controller.serviceAccount.annotations | default dict) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "praxis.serviceAccountName.controller" . }}
  namespace: {{ include "praxis.namespace" . }}
  labels:
    {{- include "praxis.labels" . | nindent 4 }}
    {{- include "praxis.component.commonLabels" (dict "root" . "component" "controller") | nindent 4 }}
    {{- include "praxis.renderNonSelectorLabels" (dict "labels" (.Values.serviceAccount.controller.labels | default dict)) | nindent 4 }}
    {{- include "praxis.renderNonSelectorLabels" (dict "labels" (.Values.controller.serviceAccount.labels | default dict)) | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- if gt (len $controllerSaAnns) 0 }}
  annotations:
    {{- toYaml $controllerSaAnns | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.controller.automountServiceAccountToken }}
{{- end }}
