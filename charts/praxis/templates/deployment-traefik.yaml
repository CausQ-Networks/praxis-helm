{{- if eq (include "praxis.traefik.separateDeployment" .) "true" }}
{{- $root := . -}}
{{- $tf := .Values.traefik -}}
{{- $fullname := printf "%s-traefik" (include "praxis.fullname" .) -}}
{{- $namespace := include "praxis.namespace" . -}}
{{- $saName := include "praxis.serviceAccountName" . -}}
{{- $replicas := $tf.replicaCount | default 1 -}}
{{- $depMetaAnns := mergeOverwrite (dict) (include "praxis.global.commonAnnotations" $root | fromYaml) (include "praxis.component.commonAnnotations" (dict "root" $root "component" "traefik") | fromYaml) ($tf.deployment.annotations | default dict) -}}
{{- $podMetaAnns := mergeOverwrite (dict) (include "praxis.global.commonAnnotations" $root | fromYaml) ($root.Values.global.additionalPodAnnotations | default dict) (include "praxis.component.commonAnnotations" (dict "root" $root "component" "traefik") | fromYaml) ($tf.deployment.podAnnotations | default dict) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  namespace: {{ $namespace }}
  labels:
    {{- include "praxis.labels" $root | nindent 4 }}
    {{- include "praxis.component.commonLabels" (dict "root" $root "component" "traefik") | nindent 4 }}
    {{- include "praxis.renderNonSelectorLabels" (dict "labels" ($tf.deployment.labels | default dict)) | nindent 4 }}
    app.kubernetes.io/component: traefik-standalone
  {{- if gt (len $depMetaAnns) 0 }}
  annotations:
    {{- toYaml $depMetaAnns | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $replicas }}
  revisionHistoryLimit: {{ $root.Values.global.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels:
      {{- include "praxis.traefik.standalone.selectorLabels" $root | nindent 6 }}
  {{- if $root.Values.runtime.minReadySeconds }}
  minReadySeconds: {{ $root.Values.runtime.minReadySeconds }}
  {{- end }}
  {{- include "praxis.updateStrategy" (dict "root" $root "override" ($tf.deployment.updateStrategy | default dict) "blockSurge" (eq (include "praxis.traefik.blocksSurge" $root) "true")) | nindent 2 }}
  template:
    metadata:
      labels:
        {{- include "praxis.labels" $root | nindent 8 }}
        {{- include "praxis.component.commonLabels" (dict "root" $root "component" "traefik") | nindent 8 }}
        {{- include "praxis.renderNonSelectorLabels" (dict "labels" ($root.Values.global.additionalPodLabels | default dict)) | nindent 8 }}
        {{- include "praxis.renderNonSelectorLabels" (dict "labels" ($tf.deployment.podLabels | default dict)) | nindent 8 }}
        app.kubernetes.io/component: traefik-standalone
      {{- if gt (len $podMetaAnns) 0 }}
      annotations:
        {{- toYaml $podMetaAnns | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $saName }}
      {{- /* The token is mounted into the Traefik container explicitly. */}}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $root.Values.runtime.terminationGracePeriodSeconds | default 30 }}
      {{- if $root.Values.global.priorityClassName }}
      priorityClassName: {{ $root.Values.global.priorityClassName }}
      {{- end }}
      {{- $ips := include "praxis.imagePullSecrets" $root }}
      {{- if $ips }}
    {{ $ips | nindent 6 }}
      {{- end }}
      {{- /* Merges global.affinity with the Gerbil co-location term when host gateway
             mode needs Traefik on the Gerbil node. */}}
      {{- $traefikAffinity := include "praxis.traefik.affinity" $root }}
      {{- if $traefikAffinity }}
      affinity:
        {{- $traefikAffinity | nindent 8 }}
      {{- end }}
      {{- if $root.Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml $root.Values.global.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if $root.Values.global.tolerations }}
      tolerations:
        {{- toYaml $root.Values.global.tolerations | nindent 8 }}
      {{- end }}
      {{- if $root.Values.global.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml $root.Values.global.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml (deepCopy $root.Values.global.podSecurityContext) | nindent 8 }}
      containers:
        {{- include "praxis.traefik.container" (dict "root" $root) | nindent 8 }}
      volumes:
        {{- include "praxis.traefik.volumes" $root | nindent 8 }}
{{- end }}
