{{- if eq .Values.deployment.mode "single" }}
{{- $root := . -}}
{{- $praxis := .Values.praxis -}}
{{- $gerbil := .Values.gerbil -}}
{{- $ctrl := .Values.controller -}}
{{- $tf := .Values.traefik -}}
{{- $tls := $ctrl.tls | default dict -}}
{{- $tlsEnabled := (default false $tls.enabled) -}}
{{- $renderController := and (eq .Values.deployment.type "controller") .Values.controller.enabled -}}
{{- $renderTraefik := and (eq .Values.deployment.type "standalone") .Values.traefik.enabled -}}
{{- $renderGerbil := eq (include "praxis.gerbil.resourcesEnabled" $root) "true" -}}
{{- $fullname := include "praxis.fullname" . -}}
{{- $namespace := include "praxis.namespace" . -}}
{{- $saName := include "praxis.serviceAccountName.single" . -}}
{{- $depMetaAnns := mergeOverwrite (dict) (include "praxis.global.commonAnnotations" $root | fromYaml) (include "praxis.component.commonAnnotations" (dict "root" $root "component" "praxis") | fromYaml) ($praxis.deployment.annotations | default dict) -}}
{{- $podMetaAnns := mergeOverwrite (dict) (include "praxis.global.commonAnnotations" $root | fromYaml) ($root.Values.global.additionalPodAnnotations | default dict) (include "praxis.component.commonAnnotations" (dict "root" $root "component" "praxis") | fromYaml) ($praxis.deployment.podAnnotations | default dict) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  namespace: {{ $namespace }}
  labels:
    {{- include "praxis.labels" $root | nindent 4 }}
    {{- include "praxis.component.commonLabels" (dict "root" $root "component" "praxis") | nindent 4 }}
    {{- include "praxis.renderNonSelectorLabels" (dict "labels" ($praxis.deployment.labels | default dict)) | nindent 4 }}
    app.kubernetes.io/component: single
  {{- if gt (len $depMetaAnns) 0 }}
  annotations:
    {{- toYaml $depMetaAnns | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $praxis.replicaCount | default 1 }}
  revisionHistoryLimit: {{ $root.Values.global.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels:
      {{- include "praxis.single.selectorLabels" $root | nindent 6 }}
  {{- if $root.Values.runtime.minReadySeconds }}
  minReadySeconds: {{ $root.Values.runtime.minReadySeconds }}
  {{- end }}
  {{- include "praxis.updateStrategy" (dict "root" $root "override" ($praxis.deployment.updateStrategy | default dict) "blockSurge" (or (eq (include "praxis.sqlite.blocksSurge" $root) "true") (eq (include "praxis.gerbil.blocksSurge" $root) "true") (eq (include "praxis.traefik.blocksSurge" $root) "true"))) | nindent 2 }}
  template:
    metadata:
      labels:
        {{- include "praxis.labels" $root | nindent 8 }}
        {{- include "praxis.component.commonLabels" (dict "root" $root "component" "praxis") | nindent 8 }}
        {{- include "praxis.renderNonSelectorLabels" (dict "labels" ($root.Values.global.additionalPodLabels | default dict)) | nindent 8 }}
        {{- include "praxis.renderNonSelectorLabels" (dict "labels" ($praxis.deployment.podLabels | default dict)) | nindent 8 }}
        app.kubernetes.io/component: single
      {{- if gt (len $podMetaAnns) 0 }}
      annotations:
        {{- toYaml $podMetaAnns | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $saName }}
      automountServiceAccountToken: {{ ternary $root.Values.serviceAccount.controller.automountServiceAccountToken $root.Values.serviceAccount.praxis.automountServiceAccountToken $renderController }}
      terminationGracePeriodSeconds: {{ $root.Values.runtime.terminationGracePeriodSeconds | default 30 }}
      {{- if $root.Values.global.priorityClassName }}
      priorityClassName: {{ $root.Values.global.priorityClassName }}
      {{- end }}
      {{- $ips := include "praxis.imagePullSecrets" $root }}
      {{- if $ips }}
      {{- $ips | nindent 6 }}
      {{- end }}
      {{- if $root.Values.global.affinity }}
      affinity:
        {{- toYaml $root.Values.global.affinity | nindent 8 }}
      {{- end }}
      {{- if $root.Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml $root.Values.global.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if $root.Values.global.tolerations }}
      tolerations:
        {{- toYaml $root.Values.global.tolerations | nindent 8 }}
      {{- end }}
      {{- if $root.Values.global.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml $root.Values.global.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml (deepCopy $root.Values.global.podSecurityContext) | nindent 8 }}
      {{- $dbWait := (include "praxis.wait.config" (dict "root" $root "override" ($praxis.databaseWait | default dict)) | fromYaml) | default dict -}}
      {{- $dbWaitUserEnabled := ternary (index $dbWait "enabled") true (hasKey $dbWait "enabled") -}}
      {{- $dbWaitEnabled := and (ne (include "praxis.db.mode" $root) "sqlite") $dbWaitUserEnabled -}}
      {{- $dbWaitHost := include "praxis.db.waitHost" $root | trim -}}
      {{- if and $dbWaitEnabled $dbWaitHost }}
      initContainers:
        - name: wait-for-db
          image: {{ include "praxis.wait.image" ($dbWait.image | default dict) | quote }}
          imagePullPolicy: {{ $dbWait.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: POSTGRES_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ include "praxis.database.connectionSecretName" $root }}
                  key: {{ include "praxis.db.connectionSecretKey" $root }}
          command:
            - /bin/sh
            - -c
            - |
              TIMEOUT_SECONDS={{ $dbWait.timeoutSeconds | default 300 }}
              INTERVAL_SECONDS={{ $dbWait.intervalSeconds | default 5 }}
              STABLE_SECONDS={{ $dbWait.stableSeconds | default 30 }}
              elapsed=0
              stable=0
              while [ "${elapsed}" -lt "${TIMEOUT_SECONDS}" ]; do
                if pg_isready -d "${POSTGRES_CONNECTION_STRING}" >/dev/null 2>&1; then
                  stable=$((stable + INTERVAL_SECONDS))
                  echo "PostgreSQL ready for ${stable}/${STABLE_SECONDS}s"
                  if [ "${stable}" -ge "${STABLE_SECONDS}" ]; then
                    exit 0
                  fi
                else
                  stable=0
                  echo "PostgreSQL not ready yet"
                fi
                sleep "${INTERVAL_SECONDS}"
                elapsed=$((elapsed + INTERVAL_SECONDS))
              done
              echo "Timed out waiting for stable PostgreSQL readiness"
              exit 1
          securityContext:
            {{- toYaml (mergeOverwrite (dict "runAsNonRoot" true "runAsUser" 65534 "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL"))) ($dbWait.securityContext | default dict)) | nindent 12 }}
      {{- end }}
      containers:
        - name: praxis
          image: {{ include "praxis.image" $root }}
          imagePullPolicy: {{ include "praxis.imagePullPolicy" $root }}
          ports:
            - name: external
              containerPort: {{ $praxis.service.ports.external }}
              protocol: TCP
            - name: internal-api
              containerPort: {{ $praxis.service.ports.internalApi }}
              protocol: TCP
            - name: next
              containerPort: {{ $praxis.service.ports.next }}
              protocol: TCP
            - name: integration
              containerPort: {{ $praxis.service.ports.integration }}
              protocol: TCP
            - name: ai-gateway
              containerPort: {{ $praxis.service.ports.aiGateway }}
              protocol: TCP
          env:
            - name: SERVER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "praxis.app.secretName" $root }}
                  key: {{ $praxis.secret.existingSecretKey | default $praxis.secret.generated.key | default "SERVER_SECRET" }}
            - name: POSTGRES_CONNECTION_STRING
              {{- if eq $root.Values.database.mode "sqlite" }}
              value: {{ printf "sqlite://%s" $root.Values.database.sqlite.path | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "praxis.database.connectionSecretName" $root }}
                  key: {{ include "praxis.db.connectionSecretKey" $root }}
              {{- end }}
          {{- if or $praxis.configFile.enabled $praxis.privateConfig.enabled $praxis.extraVolumeMounts (eq (include "praxis.sqlite.persistenceEnabled" $root) "true") }}
          volumeMounts:
            {{- if eq (include "praxis.sqlite.persistenceEnabled" $root) "true" }}
            - name: praxis-sqlite
              mountPath: {{ include "praxis.sqlite.mountPath" $root | quote }}
            {{- end }}
            {{- if $praxis.configFile.enabled }}
            - name: praxis-config
              mountPath: /app/config/config.yml
              subPath: config.yml
              readOnly: true
            {{- end }}
            {{- if $praxis.privateConfig.enabled }}
            {{- $pcSubPath := ternary (($praxis.privateConfig.existingSecretKey) | default "privateConfig.yml") (($praxis.privateConfig.generatedSecret | default dict).key | default "privateConfig.yml") (ne $praxis.privateConfig.existingSecretName "") }}
            - name: praxis-private-config
              mountPath: /app/config/privateConfig.yml
              subPath: {{ $pcSubPath | quote }}
              readOnly: true
            {{- end }}
            {{- with $praxis.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with $praxis.probes }}
          {{- if .startup }}
          startupProbe:
            {{- if .startup.httpGet }}
            httpGet:
              path: {{ .startup.httpGet.path }}
              port: {{ .startup.httpGet.port }}
            {{- end }}
            initialDelaySeconds: {{ .startup.initialDelaySeconds }}
            periodSeconds: {{ .startup.periodSeconds }}
            timeoutSeconds: {{ .startup.timeoutSeconds }}
            failureThreshold: {{ .startup.failureThreshold }}
          {{- end }}
          {{- if .liveness }}
          livenessProbe:
            {{- if .liveness.httpGet }}
            httpGet:
              path: {{ .liveness.httpGet.path }}
              port: {{ .liveness.httpGet.port }}
            {{- end }}
            initialDelaySeconds: {{ .liveness.initialDelaySeconds }}
            periodSeconds: {{ .liveness.periodSeconds }}
            timeoutSeconds: {{ .liveness.timeoutSeconds }}
            failureThreshold: {{ .liveness.failureThreshold }}
          {{- end }}
          {{- if .readiness }}
          readinessProbe:
            {{- if .readiness.httpGet }}
            httpGet:
              path: {{ .readiness.httpGet.path }}
              port: {{ .readiness.httpGet.port }}
            {{- end }}
            initialDelaySeconds: {{ .readiness.initialDelaySeconds }}
            periodSeconds: {{ .readiness.periodSeconds }}
            timeoutSeconds: {{ .readiness.timeoutSeconds }}
            failureThreshold: {{ .readiness.failureThreshold }}
          {{- end }}
          {{- end }}
          resources:
            {{- include "praxis.renderResources" (dict "resources" $praxis.resources "root" $root) | nindent 12 }}
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy $root.Values.global.containerSecurityContext) $praxis.securityContext) | nindent 12 }}
        {{- if $renderGerbil }}
        - name: gerbil
          image: {{ include "praxis.gerbil.image" $root }}
          imagePullPolicy: {{ $gerbil.pullPolicy | default (include "praxis.imagePullPolicy" $root) }}
          {{- if $gerbil.command }}
          command:
            {{- toYaml $gerbil.command | nindent 12 }}
          {{- end }}
          {{- if $gerbil.args }}
          args:
            {{- toYaml $gerbil.args | nindent 12 }}
          {{- else if not $gerbil.command }}
          args:
            - {{ printf "--reachableAt=http://127.0.0.1:%v" ($gerbil.ports.internalApi | default 3004) | quote }}
            - --generateAndSaveKeyTo=/var/config/key
            - {{ printf "--remoteConfig=http://127.0.0.1:%v/api/v1/" ($root.Values.praxis.service.ports.internalApi | default 3001) | quote }}
          {{- end }}
          ports:
            - name: wg1
              containerPort: {{ $gerbil.ports.wg1 }}
              protocol: UDP
            - name: wg2
              containerPort: {{ $gerbil.ports.wg2 }}
              protocol: UDP
            - name: internal-api
              containerPort: {{ $gerbil.ports.internalApi | default 3004 }}
              protocol: TCP
          {{- $gerbilEnv := include "praxis.gerbilEnv" $root | trim }}
          {{- if $gerbilEnv }}
          env:
            {{- $gerbilEnv | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: gerbil-config
              mountPath: /var/config
          {{- with $gerbil.probes }}
          {{- if .startup }}
          startupProbe:
            {{- if .startup.exec }}
            exec:
              command:
                {{- range .startup.exec.command }}
                - {{ . | quote }}
                {{- end }}
            {{- end }}
            initialDelaySeconds: {{ .startup.initialDelaySeconds }}
            periodSeconds: {{ .startup.periodSeconds }}
            timeoutSeconds: {{ .startup.timeoutSeconds }}
            failureThreshold: {{ .startup.failureThreshold }}
          {{- end }}
          {{- if .liveness }}
          livenessProbe:
            {{- if .liveness.exec }}
            exec:
              command:
                {{- range .liveness.exec.command }}
                - {{ . | quote }}
                {{- end }}
            {{- end }}
            initialDelaySeconds: {{ .liveness.initialDelaySeconds }}
            periodSeconds: {{ .liveness.periodSeconds }}
            timeoutSeconds: {{ .liveness.timeoutSeconds }}
            failureThreshold: {{ .liveness.failureThreshold }}
          {{- end }}
          {{- if .readiness }}
          readinessProbe:
            {{- if .readiness.exec }}
            exec:
              command:
                {{- range .readiness.exec.command }}
                - {{ . | quote }}
                {{- end }}
            {{- end }}
            initialDelaySeconds: {{ .readiness.initialDelaySeconds }}
            periodSeconds: {{ .readiness.periodSeconds }}
            timeoutSeconds: {{ .readiness.timeoutSeconds }}
            failureThreshold: {{ .readiness.failureThreshold }}
          {{- end }}
          {{- end }}
          resources:
            {{- include "praxis.renderResources" (dict "resources" $gerbil.resources "root" $root) | nindent 12 }}
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy $root.Values.global.containerSecurityContext) $gerbil.securityContext) | nindent 12 }}
        {{- end }}
        {{- if $renderController }}
        - name: controller
          image: {{ include "praxis.controller.image" $root }}
          imagePullPolicy: {{ include "praxis.controller.imagePullPolicy" $root }}
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "praxis.controller.configMapName" $root }}
          {{- if $ctrl.extraEnv }}
          env:
          {{- range $k, $v := $ctrl.extraEnv }}
          - name: {{ $k }}
            value: {{ $v | quote }}
          {{- end }}
          {{- end }}
          volumeMounts:
            {{- if $tlsEnabled }}
            - name: tls
              mountPath: /etc/praxis/tls
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          {{- with $ctrl.probes }}
          {{- if .startup }}
          startupProbe:
            {{- if .startup.httpGet }}
            httpGet:
              path: {{ .startup.httpGet.path }}
              port: {{ .startup.httpGet.port }}
            {{- else if .startup.exec }}
            exec:
              command:
                {{- range .startup.exec.command }}
                - {{ . | quote }}
                {{- end }}
            {{- end }}
            initialDelaySeconds: {{ .startup.initialDelaySeconds }}
            periodSeconds: {{ .startup.periodSeconds }}
            timeoutSeconds: {{ .startup.timeoutSeconds }}
            failureThreshold: {{ .startup.failureThreshold }}
          {{- end }}
          {{- if .liveness }}
          livenessProbe:
            {{- if .liveness.httpGet }}
            httpGet:
              path: {{ .liveness.httpGet.path }}
              port: {{ .liveness.httpGet.port }}
            {{- else if .liveness.exec }}
            exec:
              command:
                {{- range .liveness.exec.command }}
                - {{ . | quote }}
                {{- end }}
            {{- end }}
            initialDelaySeconds: {{ .liveness.initialDelaySeconds }}
            periodSeconds: {{ .liveness.periodSeconds }}
            timeoutSeconds: {{ .liveness.timeoutSeconds }}
            failureThreshold: {{ .liveness.failureThreshold }}
          {{- end }}
          {{- if .readiness }}
          readinessProbe:
            {{- if .readiness.httpGet }}
            httpGet:
              path: {{ .readiness.httpGet.path }}
              port: {{ .readiness.httpGet.port }}
            {{- else if .readiness.exec }}
            exec:
              command:
                {{- range .readiness.exec.command }}
                - {{ . | quote }}
                {{- end }}
            {{- end }}
            initialDelaySeconds: {{ .readiness.initialDelaySeconds }}
            periodSeconds: {{ .readiness.periodSeconds }}
            timeoutSeconds: {{ .readiness.timeoutSeconds }}
            failureThreshold: {{ .readiness.failureThreshold }}
          {{- end }}
          {{- end }}
          resources:
            {{- include "praxis.renderResources" (dict "resources" $ctrl.resources "root" $root) | nindent 12 }}
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy $root.Values.global.containerSecurityContext) ($ctrl.securityContext | default dict)) | nindent 12 }}
        {{- end }}
        {{- if $renderTraefik }}
        {{- include "praxis.traefik.container" (dict "root" $root) | nindent 8 }}
        {{- end }}
      {{- if or $praxis.configFile.enabled $praxis.privateConfig.enabled $praxis.extraVolumes $renderGerbil $renderController $renderTraefik (eq (include "praxis.sqlite.persistenceEnabled" $root) "true") }}
      volumes:
        {{- if eq (include "praxis.sqlite.persistenceEnabled" $root) "true" }}
        - name: praxis-sqlite
          persistentVolumeClaim:
            claimName: {{ include "praxis.sqlite.claimName" $root }}
        {{- end }}
        {{- if $praxis.configFile.enabled }}
        - name: praxis-config
          configMap:
            name: {{ include "praxis.fullname" $root }}-config
        {{- end }}
        {{- if $praxis.privateConfig.enabled }}
        - name: praxis-private-config
          secret:
            secretName: {{ include "praxis.privateConfig.secretName" $root }}
        {{- end }}
        {{- if $renderGerbil }}
        - name: gerbil-config
          {{- if $gerbil.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $gerbil.persistence.existingClaim | default (printf "%s-gerbil-config" (include "praxis.fullname" $root)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if and $renderController $tlsEnabled }}
        - name: tls
          secret:
            secretName: {{ include "praxis.controller.tlsSecretName" $root }}
            optional: false
        {{- end }}
        {{- if $renderController }}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- if $renderTraefik }}
        {{- include "praxis.traefik.volumes" $root | nindent 8 }}
        {{- end }}
        {{- with $praxis.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
