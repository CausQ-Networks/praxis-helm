siteInstances:
  - name: main-tunnel
    enabled: true
    praxisEndpoint: https://praxis.example.com

    provisioningKey: "YOUR_PROVISIONING_KEY"
    siteName: "my-site"

    configPersistence:
      enabled: true
      type: emptyDir

    provisioningBlueprintFile: /etc/praxis/provisioning-blueprint.yaml
    provisioningBlueprintData: |
      version: 1
      routes: []
